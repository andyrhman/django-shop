{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

  </head>
  <body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
      <div class="card shadow-sm w-100" style="max-width: 430px;">
        <div class="card-body p-4">
          <h3 class="card-title text-center mb-4">Log In</h3>

          <!-- Alert placeholder -->
          <div id="login-alert"></div>

          <form id="login-form">
            {% csrf_token %}
            <div class="mb-3">
              <label for="identifier" class="form-label">Email or Username</label>
              <input
                type="text"
                class="form-control"
                id="identifier"
                name="identifier"
                required
                placeholder="you@example.com or username"
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
              />
            </div>
            <button
              type="submit"
              id="login-btn"
              class="btn btn-primary w-100"
            >
              Log In
            </button>
          </form>

          <div class="text-center mt-3">
            No account yet?
            <a href="{% url 'register' %}">Register</a>
          </div>
        </div>
      </div>
    </div>

  <!-- Resend Verification Modal -->
  <div class="modal fade" id="resendModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Resend Verification</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="resend-alert"></div>
          <p>Your account isn’t verified yet. Enter your email to resend the verification link.</p>
          <div class="mb-3">
            <label for="resend-email" class="form-label">Email</label>
            <input type="email" id="resend-email" class="form-control"/>
          </div>
        </div>
        <div class="modal-footer">
          <button id="resend-btn" class="btn btn-primary w-100">
            Resend Email
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const loginForm = document.getElementById('login-form');
    const loginBtn  = document.getElementById('login-btn');
    const loginAlert= document.getElementById('login-alert');
    const resendModalEl = document.getElementById('resendModal');
    const resendModal   = new bootstrap.Modal(resendModalEl);
    const resendBtn     = document.getElementById('resend-btn');
    const resendAlert   = document.getElementById('resend-alert');
    const resendEmail   = document.getElementById('resend-email');

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      loginAlert.innerHTML = '';
      loginBtn.disabled = true;
      const origTxt = loginBtn.textContent;
      loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Logging in…';

      const data = {
        {% if allow_email_login %}
        email: e.target.identifier.value.trim(),
        {% else %}
        username: e.target.identifier.value.trim(),
        {% endif %}
        password: e.target.password.value
      };

      try {
        const resp = await fetch("{% url 'user_auth:api-login' %}", {
          method:'POST',credentials:'include',
          headers:{
            'Content-Type':'application/json',
            'X-CSRFToken':'{{ csrf_token }}'
          },
          body: JSON.stringify(data)
        });
        const json = await resp.json().catch(()=>({}));

        if (resp.ok) {
          window.location.href = '/';
        } else if (resp.status === 403 && json.message === 'Please verify your account first') {
          resendEmail.value = data.email || '';
          resendAlert.innerHTML = '';
          loginBtn.disabled = false;
          loginBtn.textContent = origTxt;
          resendModal.show();
        } else {
          const div = document.createElement('div');
          div.className = 'alert alert-danger';
          div.role = 'alert';
          div.textContent = json.message || JSON.stringify(json);
          loginAlert.appendChild(div);
        }
      } catch(err) {
        console.error(err);
        loginAlert.innerHTML = '<div class="alert alert-danger">Network error</div>';
      } finally {
        if (!resendModal._isShown) {
          loginBtn.disabled = false;
          loginBtn.textContent = origTxt;
        }
      }
    });

    resendBtn.addEventListener('click', async () => {
      resendAlert.innerHTML = '';
      resendBtn.disabled = true;
      const btnTxt = resendBtn.textContent;
      resendBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Sending…';

      const email = resendEmail.value.trim();
      try {
        const resp = await fetch("{% url 'user_verify:api-resend-verify' %}", {
          method:'POST',credentials:'include',
          headers:{
            'Content-Type':'application/json',
            'X-CSRFToken':'{{ csrf_token }}'
          },
          body: JSON.stringify({ email })
        });
        const json = await resp.json().catch(()=>({}));
        if (resp.ok) {
          resendAlert.innerHTML = `
            <div class="alert alert-success" role="alert">
              ${json.message}
            </div>`;
        } else {
          resendAlert.innerHTML = `
            <div class="alert alert-danger" role="alert">
              ${json.message || 'Failed to resend.'}
            </div>`;
        }
      } catch(err) {
        console.error(err);
        resendAlert.innerHTML = '<div class="alert alert-danger">Network error</div>';
      } finally {
        resendBtn.disabled = false;
        resendBtn.textContent = btnTxt;
      }
    });
  });
  </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
