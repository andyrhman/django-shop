{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Verify Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <style>
      body { background-color: #f8f9fa; }
      .spinner-container {
        height: 50vh;
      }
    </style>
  </head>
  <body>
    <div class="container d-flex flex-column justify-content-center align-items-center spinner-container">
      <div id="verifying" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Verifying...</span>
        </div>
        <div class="mt-3">Verifying your account…</div>
      </div>

      <div id="verify-alert" class="w-100" style="max-width: 400px;"></div>

      <div id="continue-btn" class="mt-3 d-none">
        <a href="{% url 'login' %}" class="btn btn-success">Go to Login</a>
        <a href="{% url 'home' %}"  class="btn btn-outline-secondary">Home</a>
      </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const verifyingEl = document.getElementById('verifying');
        const alertBox    = document.getElementById('verify-alert');
        const contBtn     = document.getElementById('continue-btn');

        const parts = window.location.pathname.replace(/\/$/, '').split('/');
        const token = parts[parts.length - 1];

        const apiUrl = `/api/verify/${encodeURIComponent(token)}`;

        try {
            const res = await fetch(apiUrl, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': "{{ csrf_token }}",
            },
        });
        const json = await res.json().catch(() => ({}));

        verifyingEl.classList.add('d-none');
        alertBox.innerHTML = `
            <div class="alert alert-${res.ok ? 'success' : 'danger'} text-center" role="alert">
            ${json.message || (res.ok ? 'Verified successfully.' : 'Verification failed.')}
            </div>`;
        } catch (err) {
        console.error(err);
        verifyingEl.classList.add('d-none');
        alertBox.innerHTML = `
            <div class="alert alert-danger text-center" role="alert">
            Network error. Please try again.
            </div>`;
        } finally {
        contBtn.classList.remove('d-none');
        }
    });
    </script>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
